name: Release Tray App

on:
  push:
    tags:
      - 'tray-v*'
  # Manual release: tauri-action creates the tray-v<version> tag and the
  # GitHub release itself — no tag-push rights needed.
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.6.0); tag tray-v<version> is created on the chosen ref'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Resolve version (tag or dispatch input)
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#tray-v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Patch version in tauri.conf.json
        shell: bash
        working-directory: tray-app/src-tauri
        run: |
          node -e "
            const fs = require('fs');
            const conf = JSON.parse(fs.readFileSync('tauri.conf.json', 'utf8'));
            conf.version = '${{ steps.version.outputs.version }}';
            fs.writeFileSync('tauri.conf.json', JSON.stringify(conf, null, 2) + '\n');
          "

      - name: Patch version in Cargo.toml
        shell: bash
        working-directory: tray-app/src-tauri
        run: |
          sed -i.bak 's/^version = ".*"/version = "${{ steps.version.outputs.version }}"/' Cargo.toml
          rm -f Cargo.toml.bak

      - name: Install frontend dependencies
        working-directory: tray-app
        run: npm ci

      - name: Sync Cargo.lock with Cargo.toml versions
        working-directory: tray-app/src-tauri
        run: cargo update -p tauri

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          projectPath: tray-app
          tagName: tray-v${{ steps.version.outputs.version }}
          releaseName: 'Workday Tray App tray-v${{ steps.version.outputs.version }}'
          releaseBody: 'See the assets for download links. Auto-update enabled.'
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
          includeUpdaterJson: true
