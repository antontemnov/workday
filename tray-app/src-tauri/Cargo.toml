[package]
name = "app"
version = "0.8.1"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# The tauri crates move as one release set: CI resolves them fresh over a
# stale Cargo.lock, and an older tauri picks up newer internal crates
# (tauri-runtime, tauri-macros) it does not compile with. tauri / dialog /
# shell sit on the minor of their npm packages — the CLI refuses a
# major/minor mismatch. Upgrade = every line here + package.json together.
# macos-private-api: WebviewWindowBuilder::transparent() does not exist on
# macOS without it — the toast window broke the aarch64-apple-darwin build.
tauri = { version = "~2.12", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-log = "2.10"
tauri-plugin-shell = "~2.4"
tauri-plugin-single-instance = "2.5"
tauri-plugin-updater = "2.13"
tauri-plugin-dialog = "~2.8"
tauri-plugin-autostart = "2.6"
tokio = { version = "1", features = ["rt"] }
# SVG rendering for the dynamic tray icon (status dot composited on the
# octocat silhouette). resvg is pure-Rust, no native deps.
resvg = "0.43"
usvg = "0.43"
tiny-skia = "0.11"

# GetLastInputInfo for the toast presence gate (OS input idle time).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_System_SystemInformation",
  "Win32_UI_Input_KeyboardAndMouse",
] }
