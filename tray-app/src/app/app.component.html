<div class="app">
  <!-- Nav row: weekday-grid (left) · view-switcher (right), faint divider
       below. The date moved into the Day view's day-block. -->
  <header class="header">
    <div class="pill-grid weekday-grid"
         *ngIf="data"
         [title]="dayWeekdayLabel + ' · ' + data.dayType">
      <span class="pill-cell weekday-cell"
            *ngFor="let c of weekdayCells; let i = index"
            [class.active]="i === activeWeekdayCell"
            [class.weekend]="c.weekend"
            [attr.aria-current]="i === activeWeekdayCell ? 'date' : null"
            [title]="c.full">{{ c.letter }}</span>
    </div>
    <div class="pill-grid view-switcher">
      <button class="pill-cell view-btn"
              [class.active]="activeView === 'day'"
              (click)="setView('day')"
              title="Day">
        <svg viewBox="0 0 16 16">
          <circle cx="8" cy="8" r="6"/>
          <path d="M8 4v4l2.5 2.5"/>
        </svg>
      </button>
      <button class="pill-cell view-btn"
              [class.active]="activeView === 'sheet'"
              (click)="setView('sheet')"
              title="Timesheets">
        <svg viewBox="0 0 16 16">
          <rect x="2.5" y="3" width="11" height="10" rx="1.2"/>
          <path d="M2.5 6.5h11M6 3v10"/>
        </svg>
      </button>
      <button class="pill-cell view-btn"
              [class.active]="activeView === 'set'"
              (click)="setView('set')"
              title="Settings">
        <svg viewBox="0 0 16 16">
          <circle cx="8" cy="8" r="2.2"/>
          <path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- View body: Day / Timesheets / Settings -->
  <ng-container [ngSwitch]="activeView">
    <app-day-view *ngSwitchCase="'day'"
      [data]="data"
      [loading]="loading"
      [error]="error"
      [isViewingToday]="isViewingToday"
      [dateLabel]="formattedDate"
      [actionPending]="actionPending"
      [daemonStarting]="daemonStarting"
      [currentTimeMs]="currentTimeMs"
      [sensitivityPills]="sensitivityPills"
      [activityTypes]="activityTypes"
      (pillSelected)="onPillSelected($event)"
      (addTimeSubmitted)="onAddTime($event)"
      (setStartSubmitted)="submitSetStart($event)"
      (clearStartRequested)="clearDayStart()"
      (goTodayRequested)="goToday()"
      (startDaemonRequested)="startDaemon()"
      (logSubmitted)="submitLog($event)"
      (entryEditSubmitted)="submitEntryEdit($event)" />

    <app-timesheets-view *ngSwitchCase="'sheet'"
      (daySelected)="onDaySelected($event)" />

    <app-settings-view *ngSwitchCase="'set'"
      (stopDaemonRequested)="endDayModalOpen = true" />
  </ng-container>

  <!-- Toast -->
  <div class="toast error" *ngIf="actionError" (click)="dismissToast()">
    {{ actionError }}
  </div>

  <!-- Stop-daemon confirmation modal -->
  <div class="modal-backdrop" *ngIf="endDayModalOpen" (click)="endDayModalOpen = false">
    <div class="modal" (click)="$event.stopPropagation()">
      <h3>Stop daemon?</h3>
      <div class="modal-sub">
        All of today's sessions will be closed and the daemon will stop.
      </div>
      <div class="modal-actions">
        <button (click)="endDayModalOpen = false">Cancel</button>
        <button class="danger"
                [disabled]="actionPending"
                (click)="confirmEndDay()">
          Stop daemon
        </button>
      </div>
    </div>
  </div>

</div>
