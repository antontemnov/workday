<div class="app">
  <!-- Nav row: weekday-grid (left) · view-switcher (right), faint divider
       below. The date moved into the Day view's day-block. -->
  <header class="header">
    <div class="weekday-grid"
         *ngIf="data"
         [title]="dayWeekdayLabel + ' · ' + data.dayType">
      <span class="weekday-cell"
            *ngFor="let c of weekdayNav; trackBy: trackByWeekday"
            [class.active]="c.active"
            [class.today]="c.isToday"
            [class.nav]="c.navigable && !c.active"
            [attr.role]="c.navigable && !c.active ? 'button' : null"
            [attr.tabindex]="c.navigable && !c.active ? 0 : null"
            [attr.aria-current]="c.active ? 'date' : null"
            (click)="selectWeekday(c)"
            (keydown.enter)="selectWeekday(c)"
            [title]="weekdayTitle(c)">
        <span class="wd-letter">{{ c.letter }}</span>
        <span class="wd-dot"></span>
      </span>
    </div>
    <div class="view-switcher">
      <button class="view-btn"
              [class.active]="activeView === 'day'"
              (click)="setView('day')"
              title="Day">
        <svg viewBox="0 0 16 16">
          <circle cx="8" cy="8" r="6"/>
          <path d="M8 4v4l2.5 2.5"/>
        </svg>
        <span class="vb-dot"></span>
      </button>
      <button class="view-btn"
              [class.active]="activeView === 'sheet'"
              (click)="setView('sheet')"
              title="Timesheets">
        <svg viewBox="0 0 16 16">
          <rect x="2.5" y="3" width="11" height="10" rx="1.2"/>
          <path d="M2.5 6.5h11M6 3v10"/>
        </svg>
        <span class="vb-dot"></span>
      </button>
      <button class="view-btn"
              [class.active]="activeView === 'set'"
              (click)="setView('set')"
              title="Settings">
        <svg viewBox="0 0 16 16">
          <path d="M14.18 6.34 L14.18 9.66 L11.64 10.1 L12.53 12.53 L9.66 14.18 L8 12.2 L6.34 14.18 L3.47 12.53 L4.36 10.1 L1.82 9.66 L1.82 6.34 L4.36 5.9 L3.47 3.47 L6.34 1.82 L8 3.8 L9.66 1.82 L12.53 3.47 L11.64 5.9 Z"/>
          <circle cx="8" cy="8" r="2"/>
        </svg>
        <span class="vb-dot"></span>
      </button>
    </div>
  </header>

  <!-- App self-update banner: a background check found a new tray version.
       Install runs only on click; the app restarts, the daemon keeps running. -->
  <div class="update-banner" *ngIf="appUpdateVersion">
    <span class="ub-text">Update v{{ appUpdateVersion }} is ready</span>
    <button class="ub-btn"
            [disabled]="appUpdateInstalling"
            (click)="installAppUpdate()">
      {{ appUpdateInstalling ? 'Installing…' : 'Restart to update' }}
    </button>
  </div>

  <!-- View body: Day / Timesheets / Settings -->
  <ng-container [ngSwitch]="activeView">
    <app-day-view *ngSwitchCase="'day'"
      [data]="data"
      [loading]="loading"
      [error]="error"
      [isViewingToday]="isViewingToday"
      [dateLabel]="formattedDate"
      [actionPending]="actionPending"
      [daemonUserStopped]="daemonUserStopped"
      [sensitivityPills]="sensitivityPills"
      [activityTypes]="activityTypes"
      [favorites]="favorites"
      [freshEntryId]="freshEntryId"
      (pillSelected)="onPillSelected($event)"
      (addTimeSubmitted)="onAddTime($event)"
      (goTodayRequested)="goToday()"
      (logSubmitted)="submitLog($event)"
      (batchSubmitted)="submitLogBatch($event)"
      (entryEditSubmitted)="submitEntryEdit($event)"
      (entryDeleteSubmitted)="submitEntryDelete($event)"
      (favoriteAddSubmitted)="submitFavoriteAdd($event)"
      (favoritesRemoveSubmitted)="submitFavoritesRemove($event)"
      (settingsRequested)="setView('set')" />

    <app-timesheets-view *ngSwitchCase="'sheet'"
      (daySelected)="onDaySelected($event)" />

    <app-settings-view *ngSwitchCase="'set'"
      [daemonReachable]="daemonReachable"
      [daemonStarting]="daemonStarting"
      (stopDaemonRequested)="endDayModalOpen = true"
      (startDaemonRequested)="startDaemon()" />
  </ng-container>

  <!-- Toast -->
  <div class="toast error" *ngIf="actionError" (click)="dismissToast()">
    {{ actionError }}
  </div>

  <!-- Stop-daemon confirmation modal -->
  <div class="modal-backdrop" *ngIf="endDayModalOpen" (click)="endDayModalOpen = false">
    <div class="modal" (click)="$event.stopPropagation()">
      <h3>Stop daemon?</h3>
      <div class="modal-sub">
        Open sessions close now and tracking stops. The daemon stays down
        until you start it again — or the next login.
      </div>
      <div class="modal-actions">
        <button (click)="endDayModalOpen = false">Cancel</button>
        <button class="danger"
                [disabled]="actionPending"
                (click)="confirmEndDay()">
          Stop daemon
        </button>
      </div>
    </div>
  </div>

</div>
