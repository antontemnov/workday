<div class="w"
     [class.list]="list"
     [class.drag]="dragging"
     [class.ed]="editingId !== null"
     [style.--tw]="timeColumn"
     (mousedown)="onMouseDown($event)"
     (pointerdown)="onPress($event, 'move')"
     (pointermove)="onPointerMove($event)"
     (pointerup)="onPointerEnd($event)"
     (pointercancel)="onPointerEnd($event)"
     (dblclick)="onDoubleClick($event)">

  <div class="w-row"
       *ngFor="let t of timers; trackBy: trackById"
       [attr.data-id]="t.id"
       [class.run]="isRunning(t)"
       [class.wait]="isWaiting(t)"
       [class.pause]="isPaused(t)">

    <!-- The state glyph is the button: the timer's icon at rest, ⏸ or ▶ under the cursor. -->
    <button type="button"
            class="w-b"
            [attr.aria-label]="isPaused(t) ? 'Start timer' : 'Pause timer'"
            (click)="toggled.emit(t.id)">
      <span class="at-rest">
        <svg class="g-ic" viewBox="0 0 14 14" aria-hidden="true">
          <circle cx="7" cy="7" r="5.4"/>
          <path *ngIf="!isPaused(t)" d="M7 7V3.8"/>
          <path *ngIf="isPaused(t)" d="M5.7 5.1v3.8M8.3 5.1v3.8"/>
        </svg>
      </span>
      <span class="at-hov">
        <svg *ngIf="!isPaused(t)" class="g-pz" viewBox="0 0 10 10" aria-hidden="true"><path d="M3.3 2.2v5.6M6.7 2.2v5.6"/></svg>
        <svg *ngIf="isPaused(t)" class="g-go" viewBox="0 0 10 10" aria-hidden="true"><path d="M2.8 1.5l5.6 3.5-5.6 3.5z"/></svg>
      </span>
    </button>

    <app-timer-time class="w-t" [timer]="t" [asOf]="asOf" (minuteChanged)="onMinute()" />

    <!-- Under the edit the key stays and the description is a field. -->
    <ng-container *ngIf="editingId === t.id; else shownText">
      <span class="w-k" *ngIf="t.task">{{ t.task }}</span>
      <input class="w-in"
             placeholder="description"
             spellcheck="false"
             autocomplete="off"
             [value]="draft"
             (input)="onEditInput($any($event.target).value)"
             (keydown)="onEditKeydown(t, $event)" />
    </ng-container>
    <ng-template #shownText>
      <span class="w-tx" *ngIf="t.task || textOf(t)">
        <span class="w-k" *ngIf="t.task">{{ t.task }}</span>
        <span class="w-d" *ngIf="textOf(t)">{{ textOf(t) }}</span>
      </span>
    </ng-template>

    <!-- One slot in every row, so nothing shifts when a timer stops: a timer
         at rest can leave the desktop, one that is switched on can be
         described, and under the edit the slot keeps what was typed. -->
    <span class="w-acts" [class.on]="editingId === t.id">
      <button *ngIf="editingId === t.id; else atRest"
              type="button"
              class="w-x ok"
              aria-label="Keep the description"
              (click)="keep(t)">
        <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.6 6.4l2.4 2.4 4.5-5.2"/></svg>
      </button>
      <ng-template #atRest>
        <button *ngIf="isPaused(t)"
                type="button"
                class="w-x"
                aria-label="Hide from the desktop"
                (click)="rowHidden.emit(t.id)">
          <svg viewBox="0 0 12 12" aria-hidden="true">
            <path d="M1.3 6c1.2-2 2.8-3 4.7-3s3.5 1 4.7 3c-1.2 2-2.8 3-4.7 3S2.5 8 1.3 6z"/>
            <circle cx="6" cy="6" r="1.3"/>
            <path d="M2.5 10.2l7-8.4"/>
          </svg>
        </button>
        <button *ngIf="isDescribable(t)"
                type="button"
                class="w-x"
                aria-label="Edit the description"
                (click)="onPencil(t)">
          <svg viewBox="0 0 12 12" aria-hidden="true">
            <path d="M2.3 9.7l.5-2.3 5.3-5.3a1 1 0 0 1 1.4 0l.4.4a1 1 0 0 1 0 1.4L4.6 9.2z"/>
            <path d="M7.3 2.9l1.8 1.8"/>
          </svg>
        </button>
      </ng-template>
    </span>
  </div>

  <i class="rz l" (pointerdown)="onPress($event, 'left')"></i>
  <i class="rz r" (pointerdown)="onPress($event, 'right')"></i>
</div>
