<div class="ts-root">
  <!-- Row 1 — the month: ‹ back only (no future months), the title (a past
       month's title leads home), its Tempo status as a tag; the total sits on
       the hours column. -->
  <div class="ts-head">
    <button type="button" class="pback" (click)="prevMonth()">‹</button>
    <span class="plabel" [class.home]="!isCurrentMonth" (click)="backToCurrent()">{{ monthLabel }}</span>
    <span class="pst" *ngIf="periodStatus as p" [ngClass]="p.cls">{{ p.label }}</span>
    <span class="tmain" *ngIf="monthData && !loading">{{ totalLabel }}</span>
  </div>

  <!-- Row 2 — the Push navigator (blocked, Push leads to what blocks it) ·
       Fetch · why Tempo can't be read; the gap (only when there is one) under
       the total. -->
  <div class="sync">
    <ng-container *ngIf="pushView as v">
      <button *ngIf="v.kind === 'busy'" type="button" class="push-btn busy">
        <svg class="gi" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 13L12.8 3.2"/><path d="M5.8 3H13V10.2"/></svg><span class="lbl">pushing…</span>
      </button>
      <button *ngIf="v.kind === 'resolve'" type="button" class="push-btn cf" (click)="onPush($event)">
        <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M4 1.8v8.4M4 10.2L2.2 8.4M4 10.2l1.8-1.8M8 10.2V1.8M8 1.8L6.2 3.6M8 1.8l1.8 1.8"/></svg>Resolve {{ v.count }} conflict{{ v.count > 1 ? 's' : '' }}
      </button>
      <button *ngIf="v.kind === 'review'" type="button" class="push-btn" (click)="onPush($event)">Review {{ v.count }} new from Tempo</button>
      <button *ngIf="v.kind === 'nothing'" type="button" class="push-btn" disabled>
        <svg class="gi" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 13L12.8 3.2"/><path d="M5.8 3H13V10.2"/></svg>nothing to push
      </button>
      <button *ngIf="v.kind === 'push'" type="button" class="push-btn" (click)="onPush($event)">
        <svg class="gi" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 13L12.8 3.2"/><path d="M5.8 3H13V10.2"/></svg>Push<ng-container *ngIf="v.count > 0"> {{ v.count }} day{{ v.count > 1 ? 's' : '' }}</ng-container>
      </button>
    </ng-container>
    <button type="button" class="fetch" [class.busy]="fetching" (click)="onFetch()">
      <svg class="gi" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.2 2.8L5 11" stroke-dasharray="2.6 1.6"/><path d="M2.8 4.2V6.6M2.8 8.4V13.2H7.4M9.2 13.2H11.6"/></svg><span>Fetch</span>
    </button>
    <span class="push-note err" *ngIf="tempoUnreachable">Tempo unreachable</span>
    <span class="sp"></span>
    <ng-container *ngIf="monthData && !loading">
      <span class="dlt" *ngIf="gap as g" [ngClass]="g.word"><b>{{ g.amount }}</b> {{ g.word }}</span>
    </ng-container>
  </div>

  <!-- Days, newest first. An open day is one glass: the day row is its lid,
       the tickets are lines of it (the Day tab's card in sheet mode). -->
  <div class="scroll-zone" #zone>
    <div class="status-msg" *ngIf="loading">Loading…</div>
    <div class="status-msg" *ngIf="!loading && error && !monthData">{{ error }}</div>
    <div class="status-msg" *ngIf="isEmpty">No days yet — this month hasn't started</div>

    <ng-container *ngIf="!loading">
      <ng-container *ngFor="let week of weeks; trackBy: trackByWeek">
        <div class="week-sep"><span class="t">{{ week.label }}</span><span class="l"></span></div>

        <div class="day"
             *ngFor="let row of week.rows; trackBy: trackByDate"
             [class.today]="row.isToday"
             [class.dim]="row.dim"
             [class.open]="isOpen(row)"
             [style.--heat]="row.heat">
          <div class="dbox" [class.dcard]="isOpen(row)">
            <div class="day-row" [class.static]="!canOpen(row)" (click)="toggleDay(row)">
              <span class="d-num">{{ row.dayNum }}</span>
              <span class="d-wd">{{ row.weekday }}</span>
              <span class="d-status" [ngSwitch]="row.state"
                    [class.tracking]="row.state === 'tracking'"
                    [class.conflict]="row.state === 'conflict'"
                    [class.out]="row.state === 'unpushed'"
                    [class.pushed]="row.state === 'pushed'">
                <ng-container *ngSwitchCase="'tracking'"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 1 L9 5 L2 9 Z"/></svg>tracking</ng-container>
                <ng-container *ngSwitchCase="'conflict'"><span class="sdot"></span>conflict</ng-container>
                <ng-container *ngSwitchCase="'unpushed'"><span class="sdot"></span>unpushed</ng-container>
                <ng-container *ngSwitchCase="'pushed'"><span class="sdot"></span>pushed</ng-container>
              </span>
              <span class="d-note" [class.holiday]="!!row.holidayName && !(row.isToday && isOpen(row))">{{ noteOf(row) }}</span>
              <button *ngIf="showDayPush(row)" type="button" class="g-btn blue" (click)="onPushDay(row, $event)">
                <svg class="gi" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 13L12.8 3.2"/><path d="M5.8 3H13V10.2"/></svg><span>Push</span>
              </button>
              <button *ngIf="showLog(row)" type="button" class="g-btn mauve" [disabled]="actionPending" (click)="openCloud(row, $event)">
                <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 2.6V9.4M2.6 6H9.4"/></svg><span>Log</span>
              </button>
              <span class="d-hours" [class.zero]="!hasHours(row)">{{ hoursLabel(row) }}</span>
            </div>

            <app-logged-panel
              *ngIf="isOpen(row)"
              [sheet]="true"
              [date]="row.date"
              [entries]="row.entries"
              [openSessions]="row.openSessions"
              [closedSessions]="row.closedSessions"
              [foreign]="row.foreign"
              [conflicts]="row.conflicts"
              [refusals]="refusalsFor(row.date)"
              [unseen]="unseenFor(row.date)"
              [freshEntryId]="freshIdFor(row.date)"
              [issueSummaries]="issueSummaries"
              [roundingMinutes]="roundingMinutes"
              [readOnly]="readOnlyDay(row)"
              [locked]="monthClosed"
              [actionPending]="cardsBusy"
              [activityTypes]="activityTypes"
              [activityAllowed]="activityAllowed"
              [jiraBaseUrl]="jiraBaseUrl"
              (patchCommitted)="onPanelPatch(row.date, $event)"
              (deleteCommitted)="onPanelDelete(row.date, $event)"
              (sessionDeleteCommitted)="onPanelSessionDelete(row.date, $event)"
              (taskDeleteCommitted)="onPanelTaskDelete(row.date, $event)"
              (entryAdded)="onPanelAdd(row.date, $event)"
              (resolveCommitted)="onPanelResolve(row.date, $event)"
              (dayTotalChanged)="onDayTotal(row.date, $event)"
              (sidesPendingChanged)="onSidesPending(row.date, $event)" />
          </div>
        </div>
      </ng-container>
    </ng-container>
  </div>

  <div class="toast" [class.on]="toastOn">{{ toastText }}</div>
</div>

<!-- ＋Log — the Day tab's cloud, hung under the lid of its day -->
<div class="cloud-backdrop" [class.open]="cloudOpen" (click)="closeCloud()"></div>
<app-log-cloud
  [open]="cloudOpen"
  [favorites]="favorites"
  [activityTypes]="activityTypes"
  [activityAllowed]="activityAllowed"
  [actionPending]="actionPending"
  [style.top.px]="cloudTop"
  [style.transform-origin]="cloudOrigin"
  (chipPicked)="onChipPicked($event)"
  (formSubmitted)="onCloudForm($event)"
  (batchSubmitted)="onCloudBatch($event)"
  (favoriteSaved)="favoriteAddSubmitted.emit($event)"
  (favoritesRemoved)="favoritesRemoveSubmitted.emit($event)"
  (settingsRequested)="onCloudSettings()"
  (closed)="closeCloud()" />
