<button *ngIf="action; else indicator"
        type="button"
        class="badge act"
        [ngClass]="statusClass"
        [class.pending]="pending"
        [disabled]="pending"
        [attr.aria-label]="actionTitle"
        [title]="actionTitle"
        (click)="onClick()">
  <span class="face state"><span class="badge-dot"></span>{{ label }}</span>
  <span class="face action" aria-hidden="true">
    <svg *ngIf="action === 'pause'" class="ico" viewBox="0 0 10 10">
      <rect x="1.2" y="0.5" width="2.6" height="9" rx="0.6"></rect>
      <rect x="6.2" y="0.5" width="2.6" height="9" rx="0.6"></rect>
    </svg>
    <svg *ngIf="action === 'resume'" class="ico" viewBox="0 0 10 10">
      <path d="M1.5 0.6 L9 5 L1.5 9.4 Z"></path>
    </svg>
    {{ actionWord }}
  </span>
</button>

<ng-template #indicator>
  <span class="badge" [ngClass]="statusClass">
    <span class="badge-dot"></span>{{ label }}
  </span>
</ng-template>
