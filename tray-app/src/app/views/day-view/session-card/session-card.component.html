<div class="card" [class.paused]="isPaused">
  <!-- 1 · Identity -->
  <div class="head">
    <span class="repo">{{ repoName }}</span>
    <span class="tag" *ngIf="session.task">{{ session.task }}</span>
    <span class="branch" [title]="session.branch">{{ session.branch }}</span>
    <span class="badge" [ngClass]="statusClass">
      <span class="badge-dot"></span>{{ statusLabel }}
    </span>
  </div>

  <!-- 2 · Metrics: time chip + git chip, both left with a clear gap between -->
  <div class="metrics">
    <button class="chip time"
            (click)="onTimeClick()"
            [disabled]="!isViewingToday || actionPending"
            title="Click to add / adjust time">
      <svg class="mi" viewBox="0 0 14 14" aria-hidden="true">
        <circle cx="7" cy="8.4" r="4.7" fill="none" stroke="currentColor" stroke-width="1.3"></circle>
        <path d="M7 8.4V5.7" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"></path>
        <path d="M5.5 1.4h3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"></path>
        <path d="M7 1.4v2.3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"></path>
      </svg>
      <span class="time-val">{{ effectiveLabel }}</span>
      <ng-container *ngIf="manualLabel">
        <span class="sep"></span>
        <span class="manual">{{ manualLabel }}</span>
      </ng-container>
    </button>
    <span class="chip git" [title]="session.evidence.filesChanged + ' files changed'">
      <svg class="mi" viewBox="0 0 14 14" aria-hidden="true">
        <circle cx="7" cy="7" r="2.5" fill="none" stroke="currentColor" stroke-width="1.3"></circle>
        <path d="M0.7 7h2M11.3 7h2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"></path>
      </svg>
      <span class="commits">{{ session.evidence.commits }}</span>
      <span class="sep"></span>
      <span class="added">+{{ session.evidence.linesAdded }}</span>
      <span class="removed">−{{ session.evidence.linesRemoved }}</span>
    </span>
  </div>

  <!-- 3 · Controls: sensitivity scale + Pause/Resume (only when actionable) -->
  <div class="controls">
    <div class="scale" [class.dis]="isManualPaused" [attr.title]="isManualPaused ? 'Locked while paused' : null">
      <button class="sp"
              *ngFor="let p of speedPills"
              [class.on]="activeSpeed === p.key"
              [ngClass]="'sp-' + p.key"
              [disabled]="isManualPaused || actionPending || !isViewingToday"
              [title]="p.title"
              (click)="onSpeedClick(p.key)">{{ p.label }}</button>
    </div>

    <button class="track"
            *ngIf="trackingAction"
            [ngClass]="trackingAction"
            [disabled]="actionPending"
            [title]="trackingAction === 'pause' ? 'Pause this session' : 'Resume tracking'"
            (click)="onTrackingClick()">
      <svg class="track-ico" *ngIf="trackingAction === 'pause'" viewBox="0 0 10 10" aria-hidden="true">
        <rect x="1.2" y="0.5" width="2.6" height="9" rx="0.6"></rect>
        <rect x="6.2" y="0.5" width="2.6" height="9" rx="0.6"></rect>
      </svg>
      <svg class="track-ico" *ngIf="trackingAction === 'resume'" viewBox="0 0 10 10" aria-hidden="true">
        <path d="M1.5 0.6 L9 5 L1.5 9.4 Z"></path>
      </svg>
      {{ trackingAction === 'pause' ? 'Pause' : 'Resume' }}
    </button>
  </div>

  <!-- Stamina = bottom edge: length + colour encode the level; hover shows a tip -->
  <div class="edge">
    <span class="fill"
          [class.shimmer]="isAlwaysOn"
          [style.width.%]="isAlwaysOn ? 100 : staminaPercent"
          [style.background]="isAlwaysOn ? null : staminaColor"></span>
    <span class="edge-tip">{{ staminaTooltip }}</span>
  </div>
</div>
