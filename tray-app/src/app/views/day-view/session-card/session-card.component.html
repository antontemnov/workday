<div class="card" [class.paused]="isPaused" [class.menu-open]="menuOpen" [class.pop-open]="addPopoverOpen">
  <!-- 1 · Identity -->
  <div class="head">
    <span class="repo">{{ repoName }}</span>
    <span class="sep"></span>
    <span class="branch" [title]="session.branch">{{ session.branch }}</span>
    <app-status-badge
      [statusClass]="statusClass"
      [label]="statusLabel"
      [action]="trackingAction"
      [pending]="actionPending"
      (act)="onTrackingClick()" />
  </div>

  <!-- 2 · Metrics: time · git · mode picker (Pause/Resume now lives in the badge) -->
  <div class="metrics">
    <span class="time-anchor">
      <button class="chip time"
              (click)="onTimeClick()"
              [class.active]="addPopoverOpen"
              [disabled]="!canAddTime || actionPending"
              [title]="canAddTime ? 'Click to add manual time' : 'No task — use Log to add time'">
        <svg class="mi" viewBox="0 0 14 14" aria-hidden="true">
          <circle cx="7" cy="8.4" r="4.7" fill="none" stroke="currentColor" stroke-width="1.3"></circle>
          <path d="M7 8.4V5.7" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"></path>
          <path d="M5.5 1.4h3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"></path>
          <path d="M7 1.4v2.3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"></path>
        </svg>
        <span class="time-val">{{ effectiveLabel }}</span>
      </button>

      <!-- Add-time popover — opens down from the chip; outside click / Esc closes -->
      <div class="add-pop-backdrop" *ngIf="addPopoverOpen" (click)="closeAddPopover()"></div>
      <div class="add-pop" *ngIf="addPopoverOpen" (keydown.escape)="closeAddPopover()">
        <div class="add-pop-title">Add time</div>
        <div class="add-pop-sub">{{ addSubtitle }}</div>
        <div class="add-field">
          <label>Duration</label>
          <app-duration-field
            [value]="addTimeStr"
            (valueChange)="addTimeStr = $event; attemptedAdd = false"
            [invalid]="attemptedAdd && addMinutesInvalid"
            (enter)="applyAdd()" />
        </div>
        <div class="add-actions">
          <button class="add-btn primary" [disabled]="actionPending" (click)="applyAdd()">Add</button>
        </div>
      </div>
    </span>
    <span class="chip git" [title]="session.evidence.filesChanged + ' files changed'">
      <svg class="mi" viewBox="0 0 14 14" aria-hidden="true">
        <circle cx="7" cy="7" r="2.5" fill="none" stroke="currentColor" stroke-width="1.3"></circle>
        <path d="M0.7 7h2M11.3 7h2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"></path>
      </svg>
      <span class="commits">{{ session.evidence.commits }}</span>
      <span class="sep"></span>
      <span class="added">+{{ session.evidence.linesAdded }}</span>
      <span class="removed">−{{ session.evidence.linesRemoved }}</span>
    </span>

    <!-- Mode picker — collapses the old scale row onto this line -->
    <app-mode-dropdown
      [options]="speedPills"
      [value]="session.sensitivity"
      [disabled]="isManualPaused || actionPending || !isViewingToday"
      (selected)="onSpeedClick($event)"
      (openChange)="menuOpen = $event" />

  </div>

  <!-- Stamina = bottom edge: length + colour encode the level; hover shows a tip -->
  <div class="edge">
    <span class="fill"
          [class.shimmer]="isAlwaysOn"
          [style.width.%]="isNonstopPaused ? 0 : (isAlwaysOn ? 100 : staminaPercent)"
          [style.background]="isAlwaysOn ? null : staminaColor"></span>
    <span class="edge-tip" *ngIf="!isNonstopPaused">{{ staminaTooltip }}</span>
  </div>
</div>
