<div class="card"
     [class.paused]="isPaused"
     [class.menu-open]="menuOpen"
     [class.pop-open]="addPopoverOpen"
     [style.--st-glint]="stateGlint"
     [style.--st-glint-soft]="stateGlintSoft"
     [style.--st-sweep]="stateSweep">
  <!-- Band 1: identity — ticket chip (doubles as the tracking control) ·
       repo · branch · time. The dot is the whole status story: green pulse =
       accruing, grey = not. Hover morphs to the action only when one exists
       (Live → Pause, manual pause → Resume). -->
  <div class="r-l1">
    <button *ngIf="session.task && trackingAction; else staticKey"
            type="button"
            class="c-key act"
            [class.will-pause]="trackingAction === 'pause'"
            [disabled]="actionPending"
            [attr.aria-label]="trackingActionTitle"
            (click)="onTrackingClick()">
      <span class="face state"><span class="k-dot" [class.on]="isAccruing"></span>{{ session.task }}</span>
      <span class="face action" [class.resume]="trackingAction === 'resume'" aria-hidden="true">
        <svg *ngIf="trackingAction === 'pause'" class="k-ico" viewBox="0 0 10 10">
          <rect x="1.2" y="0.5" width="2.6" height="9" rx="0.6"></rect>
          <rect x="6.2" y="0.5" width="2.6" height="9" rx="0.6"></rect>
        </svg>
        <svg *ngIf="trackingAction === 'resume'" class="k-ico" viewBox="0 0 10 10">
          <path d="M1.5 0.6 L9 5 L1.5 9.4 Z"></path>
        </svg>
        {{ trackingAction === 'pause' ? 'Pause' : 'Resume' }}
      </span>
    </button>
    <ng-template #staticKey>
      <span class="c-key" [class.none]="!session.task">
        <span class="k-dot" *ngIf="session.task" [class.on]="isAccruing"></span>{{ session.task || '—' }}
      </span>
    </ng-template>
    <span class="c-nm"><b class="repo">{{ repoName }}</b><span class="br"> · {{ session.branch }}</span></span>

    <span class="time-anchor">
      <button class="c-dur"
              [class.armed]="addPopoverOpen"
              (click)="onTimeClick()"
              [disabled]="!canAddTime || actionPending"
              [title]="timeChipTitle">{{ effectiveLabel }}</button>

      <!-- Add-time popover — opens down from the time; outside click / Esc closes -->
      <div class="add-pop-backdrop" *ngIf="addPopoverOpen" (click)="closeAddPopover()"></div>
      <div class="add-pop" *ngIf="addPopoverOpen" (keydown.escape)="closeAddPopover()">
        <div class="add-pop-title">Add time</div>
        <div class="add-pop-sub">{{ addSubtitle }}</div>
        <div class="add-field">
          <label>Duration</label>
          <app-duration-field
            [value]="addTimeStr"
            (valueChange)="addTimeStr = $event; attemptedAdd = false"
            [invalid]="attemptedAdd && addMinutesInvalid"
            (enter)="applyAdd()" />
        </div>
        <div class="add-actions">
          <button class="add-btn primary" [disabled]="actionPending" (click)="applyAdd()">Add</button>
        </div>
      </div>
    </span>
  </div>

  <!-- Band 2: commits · churn · mode picker (status lives in the chip's dot) -->
  <div class="r-l2">
    <span class="c-stats">
      <svg width="13" height="8" viewBox="0 0 13 8" aria-hidden="true"><line x1="0" y1="4" x2="3.4" y2="4" stroke="currentColor" stroke-width="1.2"/><circle cx="6.5" cy="4" r="2.3" fill="none" stroke="currentColor" stroke-width="1.2"/><line x1="9.6" y1="4" x2="13" y2="4" stroke="currentColor" stroke-width="1.2"/></svg><span class="commits">{{ session.evidence.commits }}</span><span class="csep">·</span><b class="plus">+{{ session.evidence.linesAdded }}</b><b class="minus">−{{ session.evidence.linesRemoved }}</b>
    </span>

    <app-mode-dropdown
      [options]="speedPills"
      [value]="session.sensitivity"
      [disabled]="isManualPaused || actionPending"
      (selected)="onSpeedClick($event)"
      (openChange)="menuOpen = $event" />
  </div>

  <!-- Stamina = bottom edge: length + colour encode the level; hover shows a tip -->
  <div class="edge">
    <span class="edge-clip">
      <span class="fill"
            [class.shimmer]="isAlwaysOn"
            [style.width.%]="isNonstopPaused ? 0 : (isAlwaysOn ? 100 : staminaPercent)"
            [style.background]="isAlwaysOn ? null : staminaColor"></span>
    </span>
    <span class="edge-tip" *ngIf="!isNonstopPaused">{{ staminaTooltip }}</span>
  </div>
</div>
