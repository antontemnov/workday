<button type="button"
        class="dd"
        [ngClass]="modeClass(value)"
        [class.open]="open"
        [disabled]="disabled"
        [title]="current?.title || ''"
        [attr.aria-haspopup]="'listbox'"
        [attr.aria-expanded]="open"
        (click)="toggle()">
  <span class="lbl">{{ current?.label }}</span>
  <span class="dsep"></span>
  <span class="chev" aria-hidden="true">▾</span>
</button>

<div class="menu" *ngIf="open" role="listbox">
  <button type="button"
          class="opt"
          *ngFor="let o of options"
          [ngClass]="'o-' + o.key"
          [class.sel]="o.key === value"
          [title]="o.title || ''"
          role="option"
          [attr.aria-selected]="o.key === value"
          (click)="choose(o.key)">
    <span class="chk" aria-hidden="true">{{ o.key === value ? '✓' : '' }}</span>
    <span class="ml">{{ o.label }}</span>
    <span class="md">{{ o.description }}</span>
  </button>
</div>
