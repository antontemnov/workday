<!-- Loading -->
<div class="status-msg" *ngIf="loading">Connecting to daemon...</div>

<!-- Daemon offline. No Start button here: the watchdog brings a crashed
     daemon back on its own; a deliberate stop is reverted from Settings. -->
<div class="start-screen" *ngIf="error && !loading">
  <div class="daemon-state" [class.stopped]="daemonUserStopped">
    {{ daemonUserStopped ? 'Daemon stopped' : 'Daemon unreachable' }}
  </div>
  <div class="start-hint">
    {{ daemonUserStopped ? 'Start it again from Settings' : 'Restarting automatically…' }}
  </div>
</div>

<!-- Displacement map for the day header's bottom edge (lab-2 liquid stage):
     R/G channels = x/y offsets, #808000 = neutral. The ramp goes BELOW
     neutral (G→64): the edge samples from inside the glass, stretching
     content on its way out — never previewing what still sits under the
     header, which would paint a stripe and eat the gap to the first row. -->
<svg class="fx-defs" aria-hidden="true">
  <filter id="dayheadLens" x="-10%" y="-100%" width="120%" height="300%" color-interpolation-filters="sRGB">
    <feImage href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='10'><linearGradient id='y' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='%23808000'/><stop offset='1' stop-color='%23804000'/></linearGradient><rect width='40' height='10' fill='url(%23y)'/></svg>"
      x="0" y="0" width="2000" height="10" preserveAspectRatio="none" result="m"/>
    <feDisplacementMap in="SourceGraphic" in2="m" scale="14" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<!-- The feed: sticky day header, then live sessions → (suggestions slot,
     epoch 4) → history newest-first. One scroll, no sections. -->
<!-- Right-click on free content space (cards stop their own) — the window's
     menu: feed sort method. -->
<div class="content" *ngIf="data && !error" (contextmenu)="onFeedContextMenu($event)">
  <div class="day-head" #dayHead>
    <!-- Weekday rides above the date, out of flow: the flex row keeps its
         three participants (date · ＋Log · total) and the bar its height. -->
    <span class="day-week">{{ weekdayLabel }}</span>
    <h1 class="day-date">{{ dateLabel }}</h1>
    <button class="g-btn"
            (click)="openCloud()"
            [disabled]="actionPending"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 2.6V9.4M2.6 6H9.4"/></svg>Log</button>
    <!-- Width is pinned to the label's character count: a fixed box per
         length, so glyph/DPI rounding can't tremble the Log capsule when
         digits swap; it shifts only when the format itself changes
         (59m → 1h 00m, 9h → 10h). On an empty day the span stays as a
         zero-width baseline strut (.empty collapses its horizontal
         footprint) — dropping it would let the date ride up under the
         weekday, since the total's ascent is what holds the baseline. -->
    <span class="day-total"
          [class.empty]="!dayTotalLabel"
          [style.width.ch]="dayTotalLabel.length"
          [class.flash]="dayFlash">{{ dayTotalLabel }}</span>
  </div>

  <!-- Live sessions — "now" sits on top of the feed -->
  <app-session-card
    *ngFor="let s of openSessions"
    [session]="s"
    [actionPending]="actionPending"
    [issueSummaries]="issueSummaries"
    [jiraBaseUrl]="jiraBaseUrl"
    [speedPills]="sensitivityPills"
    (pillSelected)="pillSelected.emit($event)"
    (addTimeSubmitted)="addTimeSubmitted.emit($event)" />

  <!-- Suggested — graphite blueprint offers under the live cards; never counted anywhere -->
  <app-suggestion-row
    *ngFor="let g of suggestions; trackBy: trackBySuggestion"
    [class.cloud-anchor]="isCloudAnchor(g)"
    [suggestion]="g"
    [actionPending]="actionPending"
    [activityTypes]="activityTypes"
    [activityAllowed]="activityAllowed"
    [summaries]="suggestionSummaries"
    [jiraBaseUrl]="jiraBaseUrl"
    [picked]="pickFor(g)"
    (pickRequested)="openCloudForAccept(g, $event)"
    (acceptSubmitted)="onSuggestionAccept(g, $event)"
    (dismissed)="onSuggestionDismiss(g)"
    (muteSubmitted)="onSuggestionMute(g, $event)" />

  <!-- Radar only when the whole day is empty — otherwise the history speaks -->
  <div class="waiting" *ngIf="dayEmpty">
    <div class="radar">
      <span class="ring"></span>
      <svg width="20" height="20" viewBox="0 0 22 22" fill="none">
        <circle cx="11" cy="11" r="3.2" fill="#94e2d5"/>
        <path d="M11 3.5 a7.5 7.5 0 0 1 7.5 7.5" stroke="#94e2d5" stroke-width="1.6" stroke-linecap="round" opacity="0.55"/>
        <path d="M11 18.5 a7.5 7.5 0 0 1 -7.5 -7.5" stroke="#94e2d5" stroke-width="1.6" stroke-linecap="round" opacity="0.55"/>
      </svg>
    </div>
    <div class="waiting-title">Tracking is on</div>
    <div class="waiting-sub">any activity in your repos starts tracking</div>
  </div>

  <!-- History — manual entries and session-born groups, newest first -->
  <app-logged-panel
    [entries]="manualEntries"
    [closedSessions]="closedSessions"
    [issueSummaries]="issueSummaries"
    [actionPending]="actionPending"
    [activityTypes]="activityTypes"
    [activityAllowed]="activityAllowed"
    [favorites]="favorites"
    [freshEntryId]="freshEntryId"
    [arriveFrom]="suggestionArrive"
    [feedSort]="feedSort"
    [jiraBaseUrl]="jiraBaseUrl"
    (patchCommitted)="onPanelPatch($event)"
    (deleteCommitted)="entryDeleteSubmitted.emit($event)"
    (sessionDeleteCommitted)="sessionDeleteSubmitted.emit($event)"
    (taskDeleteCommitted)="taskDeleteSubmitted.emit($event)"
    (favoriteAdded)="favoriteAddSubmitted.emit($event)"
    (liveDiffChanged)="onLiveDiff($event)" />
</div>

<!-- Log cloud overlay — opens below the sticky header -->
<div class="cloud-backdrop" [class.open]="cloudOpen" (click)="closeCloud()"></div>
<app-log-cloud
  *ngIf="data && !error"
  [open]="cloudOpen"
  [favorites]="favorites"
  [activityTypes]="activityTypes"
  [activityAllowed]="activityAllowed"
  [actionPending]="actionPending"
  [acceptTarget]="acceptTarget"
  [issueSummaries]="suggestionSummaries"
  (acceptPicked)="onAcceptPicked($event)"
  [style.top.px]="overlayTop"
  [style.transform-origin]="cloudOrigin"
  (chipPicked)="onChipPicked($event)"
  (formSubmitted)="onFormSubmitted($event)"
  (batchSubmitted)="onBatchSubmitted($event)"
  (favoriteSaved)="favoriteAddSubmitted.emit($event)"
  (favoritesRemoved)="favoritesRemoveSubmitted.emit($event)"
  (settingsRequested)="onSettingsRequested()"
  (closed)="closeCloud()" />
