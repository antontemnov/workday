<div class="logged-pane" [class.collapsed]="collapsed">
  <div class="lp-head" (click)="toggleCollapsed($event)" title="Collapse / expand">
    <span class="label">Logged</span>
    <button class="lp-mini"
            *ngIf="isViewingToday"
            (click)="onMiniClick($event)"
            [disabled]="actionPending"
            title="Log time…">＋<span class="mb" *ngIf="suggestedCount > 0">{{ suggestedCount }}</span></button>
    <span class="sum" [class.flash]="sumFlash">{{ formatDurationHm(sumMs) }}</span>
  </div>

  <div class="lp-body">
    <div class="lp-clip">
      <div class="lp-table">
        <div class="ghost-row" *ngIf="isViewingToday" (click)="logRequested.emit()">
          <span class="g-plus">＋</span><span>Log time…</span>
          <span class="g-sugg" *ngIf="suggestedCount > 0">
            <span class="sdot"></span>{{ suggestedCount }} suggested
          </span>
        </div>

        <div class="log-row"
             *ngFor="let e of displayEntries; trackBy: trackByEntry"
             [class.fresh]="isFresh(e)"
             [class.editing]="editingId === e.id"
             [title]="rowTitle(e)"
             (dblclick)="onRowDblClick(e)">

          <!-- Edit morph: the row becomes a one-line form; the ticket is a
               label (change task = delete + recreate). -->
          <ng-container *ngIf="editingId === e.id; else staticRow">
            <span class="le-form" (keydown.escape)="cancelEdit(); $event.stopPropagation()">
              <button type="button" class="le-back" title="cancel (Esc)" (click)="cancelEdit()">←</button>
              <span class="l-task">{{ e.task }}</span>
              <select class="le-act" [(ngModel)]="editActivity" (keydown.enter)="saveEdit(e)">
                <option *ngFor="let a of activityOptions" [value]="a.value">{{ a.name }}</option>
              </select>
              <input class="le-min"
                     [(wdDuration)]="editMinutes"
                     (durEnter)="saveEdit(e)"
                     title="1h 15m · 90 · 45m — wheel: ±15m" />
              <input class="le-desc"
                     [class.need]="editDescNeeded"
                     [(ngModel)]="editDescription"
                     (keydown.enter)="saveEdit(e)"
                     placeholder="description" />
              <button type="button" class="le-save" [disabled]="actionPending" (click)="saveEdit(e)">Save</button>
            </span>
          </ng-container>

          <ng-template #staticRow>
            <span class="l-task">{{ e.task }}</span>
            <span class="l-act" [class]="'l-act tone-' + activityTone(displayActivity(e))">{{ activityLabel(displayActivity(e)) }}</span>
            <span class="l-desc" [title]="displayDescription(e)">{{ displayDescription(e) }}</span>

            <ng-container *ngIf="isFresh(e); else staticMin">
              <span class="stepper">
                <button class="s-dec" (click)="stepDown($event)">−</button>
                <span class="s-val" title="wheel: ±15m" (wheel)="onStepWheel($event)">
                  {{ formatDurationHm(displayMinutes(e) * 60000) }}</span>
                <button class="s-inc" (click)="stepUp($event)">+</button>
              </span>
            </ng-container>
            <ng-template #staticMin>
              <span class="l-min">{{ formatDurationHm(displayMinutes(e) * 60000) }}</span>
            </ng-template>
          </ng-template>
        </div>
      </div>
    </div>
  </div>
</div>
