<div class="sug2">
  <div class="r-l1">
    <span class="chip" [class.ask]="!suggestion.task">{{ suggestion.task || 'task?' }}</span>
    <span class="s-title">{{ suggestion.title }}</span>
    <span class="s-dur">{{ durLabel }}</span>
  </div>
  <div class="r-l2">
    <span class="s-when">{{ suggestion.when }}</span>
    <span class="s-src"><svg class="spark" width="9" height="9" viewBox="0 0 10 10" aria-hidden="true"><path d="M5 0.3 Q5.9 4.1 9.7 5 Q5.9 5.9 5 9.7 Q4.1 5.9 0.3 5 Q4.1 4.1 5 0.3 Z" fill="currentColor"/></svg>{{ suggestion.source }}</span>
    <span class="s-act">
      <button type="button" class="btn ok" disabled>
        <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 5.5l2.5 2.5 4.5-5" fill="none" stroke="#94e2d5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button type="button" class="btn no" (click)="dismissed.emit()">
        <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 2l6 6M8 2l-6 6" fill="none" stroke="#6c7086" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </span>
  </div>
</div>
