<div class="sug2" [class.editing]="editing" [class.denying]="denying" (dblclick)="accept()" (contextmenu)="onContextMenu($event)">
  <div class="r-l1">
    <!-- The amber star IS the candidate signal, living in the badge's
         indicator slot (session-lamp parity): lit on resolved, smouldering
         on unresolved. Resolved badge is a static unlit-grey candy — the
         accept entry is Log… / dblclick. Unresolved "task?" IS a button:
         its whole meaning is "go pick a ticket" — the only entry, since a
         ✓ here could not accept anything. While editing the chip is the
         picked ticket. -->
    <span *ngIf="editing; else chipView" class="chip key"><span class="k-ind"><svg class="k-spark" width="9" height="9" viewBox="0 0 10 10" aria-hidden="true"><path d="M5 0.3 Q5.9 4.1 9.7 5 Q5.9 5.9 5 9.7 Q4.1 5.9 0.3 5 Q4.1 4.1 5 0.3 Z" fill="currentColor"/></svg></span>{{ editTask }}</span>
    <ng-template #chipView>
      <span *ngIf="suggestion.resolved as r; else askChip" class="chip key"><span class="k-ind"><svg class="k-spark" width="9" height="9" viewBox="0 0 10 10" aria-hidden="true"><path d="M5 0.3 Q5.9 4.1 9.7 5 Q5.9 5.9 5 9.7 Q4.1 5.9 0.3 5 Q4.1 4.1 5 0.3 Z" fill="currentColor"/></svg></span>{{ r.task }}</span>
      <ng-template #askChip>
        <button type="button" class="chip ask" [disabled]="actionPending" (click)="accept()"><span class="k-ind"><svg class="k-spark dim" width="9" height="9" viewBox="0 0 10 10" aria-hidden="true"><path d="M5 0.3 Q5.9 4.1 9.7 5 Q5.9 5.9 5 9.7 Q4.1 5.9 0.3 5 Q4.1 4.1 5 0.3 Z" fill="currentColor"/></svg></span>task?</button>
      </ng-template>
    </ng-template>
    <span class="s-title">{{ suggestion.title }}</span>
    <!-- Time never leaves its slot: the form swaps the span for a frameless
         wdDuration input — minutes are editable ONLY here (logged-edit rule). -->
    <input *ngIf="editing; else viewDur"
           class="s-dur edit"
           [(wdDuration)]="editMinutes"
           (durEnter)="submitEdit()"
           (keydown.escape)="cancelEdit(); $event.stopPropagation()" />
    <ng-template #viewDur><span class="s-dur">{{ durLabel }}</span></ng-template>
  </div>
  <div class="r-l2">
    <!-- Edit band — same form as a logged row's dblclick edit. -->
    <div class="rf" *ngIf="editing; else viewBand" (keydown.escape)="cancelEdit(); $event.stopPropagation()">
      <button type="button" class="le-back" (click)="cancelEdit()">←</button>
      <select class="le-act" [(ngModel)]="editActivity" (keydown.enter)="submitEdit()">
        <option value="" disabled hidden>activity…</option>
        <option *ngFor="let a of activityOptions" [value]="a.value">{{ a.name }}</option>
      </select>
      <input class="le-desc"
             [class.need]="editDescNeeded"
             [(ngModel)]="editDescription"
             (keydown.enter)="submitEdit()"
             placeholder="description" />
      <button type="button" class="le-save" [disabled]="actionPending" (click)="submitEdit()">Log</button>
    </div>
    <ng-template #viewBand>
      <div class="rv">
        <!-- Ongoing: the calendar guarantees only the start — known start,
             open end. Compressed (no spaces) so the fixed 74px column never
             clips or pushes. -->
        <span class="s-when" *ngIf="liveNow; else pastWhen">{{ startHm }}<span class="ar">→</span><span class="lv">live</span></span>
        <ng-template #pastWhen><span class="s-when">{{ whenLabel }}</span></ng-template>
        <span class="s-src">{{ suggestion.source }}</span>
        <span class="s-act">
          <button type="button" class="lnk-deny" [disabled]="actionPending" (click)="dismiss()">Deny</button>
          <!-- Only resolved rows get Log… — on unresolved ones an accept
               button would lie (nothing to log yet); entry is the chip. -->
          <button *ngIf="suggestion.resolved" type="button" class="btn-log" [disabled]="actionPending" (click)="accept()">Log…</button>
        </span>
      </div>
    </ng-template>
  </div>
</div>
