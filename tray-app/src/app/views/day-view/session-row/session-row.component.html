<!-- Column 1 — the row's anchor. Live: the pill (one node for Tracking ↔
     Paused — only classes change, so ▶/⏸ and the two words crossfade in
     place and the width never moves). Waiting: the frosted pill. Closed: the
     type word without glass. -->
<ng-container *ngIf="isClosed; else livePill">
  <span class="c-type anc" (click)="onAnchorClick($event)">{{ typeLabel }}</span>
</ng-container>
<ng-template #livePill>
  <button *ngIf="!isWaiting; else icePill"
          type="button"
          class="tb aq anc"
          [class.lead]="isTracking"
          [class.willp]="isPaused"
          (click)="onAnchorClick($event)">
    <span class="liq"><i></i></span>
    <span class="k-ind" aria-hidden="true">
      <svg class="k-lamp" viewBox="0 0 10 10"><path d="M2 1 L9 5 L2 9 Z"></path></svg>
      <svg class="k-act" viewBox="0 0 10 10">
        <rect x="1.4" y="1" width="2.8" height="8" rx="0.8"></rect>
        <rect x="5.8" y="1" width="2.8" height="8" rx="0.8"></rect>
      </svg>
    </span>
    <span class="k-word"><span class="k-txt">Tracking</span><span class="k-alt">Paused</span></span>
  </button>
  <ng-template #icePill>
    <button type="button" class="tb frost anc" (click)="onAnchorClick($event)">
      <span class="k-ind" aria-hidden="true"><span class="k-stop"></span></span>
      <span class="k-txt">Waiting</span>
    </button>
  </ng-template>
</ng-template>

<span class="repo">{{ repoName }}</span>
<span class="sc rng"><i class="csep">·</i><span class="rv">{{ range }}</span></span>
<span class="sc com"><i class="csep">·</i><svg class="g" width="13" height="8" viewBox="0 0 13 8" aria-hidden="true"><line x1="0" y1="4" x2="3.4" y2="4" stroke="currentColor" stroke-width="1.2"/><circle cx="6.5" cy="4" r="2.3" fill="none" stroke="currentColor" stroke-width="1.2"/><line x1="9.6" y1="4" x2="13" y2="4" stroke="currentColor" stroke-width="1.2"/></svg><span class="s-com">{{ session.evidence.commits }}</span></span>
<span class="sc diff"><i class="csep">·</i><b class="plus">+{{ session.evidence.linesAdded }}</b><b class="minus">−{{ session.evidence.linesRemoved }}</b></span>

<ng-container *ngIf="deleted; else durTpl">
  <button type="button" class="l-undo" (click)="onUndoClick($event)">↩ undo</button>
</ng-container>
<ng-template #durTpl>
  <span class="dur">{{ showDur ? duration : '' }}</span>
</ng-template>
